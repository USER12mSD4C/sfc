[package]
name = "sfc"
version = "0.1.0"
edition = "2021"

[dependencies]
rustyline = "14.0.0"
libc = "0.2"
memmap2 = "0.9"
rayon = "1.10"
nix = { version = "0.29", features = ["signal", "process", "term"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "touch"
path = "src/touch_impl.rs"

[[bin]]
name = "id"
path = "src/id_impl.rs"
